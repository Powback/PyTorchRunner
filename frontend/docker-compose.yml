name: pytorch-runner-frontend

services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pytorch-frontend.rule=Host(`pytorch.pow`)"
      - "traefik.http.routers.pytorch-frontend.entrypoints=web"
      - "traefik.http.services.pytorch-frontend.loadbalancer.server.port=4321"
    networks:
      - default
      - traefik
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - DATABASE_URL=postgresql://pytorch:pytorch_secret@postgres:5432/pytorchrunner
    volumes:
      - ./src:/app/src:rw
      - ./public:/app/public:rw
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4321/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  traefik:
    external: true
