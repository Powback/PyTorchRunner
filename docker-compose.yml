# PyTorchRunner — single API + worker architecture
# Frontend (Astro) serves EVERYTHING at pytorch.pow: UI + /api/* routes
# Runner (mlx_runner.py) runs on the host and connects as a worker client

name: pytorch-runner

services:
  # PostgreSQL — persistent job metadata and metrics
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pytorchrunner
      POSTGRES_USER: pytorch
      POSTGRES_PASSWORD: pytorch_secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytorch -d pytorchrunner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis — optional queue / pub-sub (available for future use)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend — Astro SSR app that serves UI + all /api/* routes
  # Single URL for EVERYTHING: pytorch.pow
  frontend:
    build: ./frontend
    restart: unless-stopped
    # No host port — accessed via Traefik at pytorch.pow
    labels:
      - "traefik.enable=true"
      # Main HTTP router → Astro on port 4321
      - "traefik.http.routers.pytorch.rule=Host(`pytorch.pow`)"
      - "traefik.http.routers.pytorch.entrypoints=web"
      - "traefik.http.services.pytorch.loadbalancer.server.port=4321"
      # WebSocket router → PowSync WS server on port 1239
      - "traefik.http.routers.pytorch-ws.rule=Host(`pytorch.pow`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.pytorch-ws.entrypoints=web"
      - "traefik.http.services.pytorch-ws.loadbalancer.server.port=1239"
    networks:
      - default
      - traefik
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - WS_PORT=1239
      - DATABASE_URL=postgresql://pytorch:pytorch_secret@postgres:5432/pytorchrunner
      - REDIS_URL=redis://redis:6379
      - ARTIFACTS_DIR=/artifacts
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      - /app/node_modules
      - artifacts-data:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4321/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis monitoring (RedisInsight)
  redis-insight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-insight.rule=Host(`redis.pytorch.pow`)"
      - "traefik.http.routers.redis-insight.entrypoints=web"
      - "traefik.http.services.redis-insight.loadbalancer.server.port=8001"
    networks:
      - default
      - traefik
    volumes:
      - redis-insight-data:/db
    profiles:
      - monitoring
    depends_on:
      redis:
        condition: service_healthy

networks:
  traefik:
    external: true

volumes:
  redis-data:
    driver: local
  redis-insight-data:
    driver: local
  postgres-data:
    driver: local
  artifacts-data:
    driver: local
